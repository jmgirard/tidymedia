# Check the package on the operating system CRAN's two Fedora flavors run.
#
# WHY THIS EXISTS
# At 0.2.1 CRAN reported two ERRORs on `r-devel-linux-x86_64-fedora-clang` and
# `-gcc`, and neither is reproducible on macOS. Fedora builds FFmpeg without
# `libx264`, because x264 is not free software, so an example that named that
# encoder failed. And `Sys.which()` there answered nothing for the absolute
# paths the test suite creates, which failed 82 tests. This job runs the same
# check on Fedora, so both answers come from the operating system rather than
# from a model of it.
#
# `ffmpeg-free` is named deliberately. It is Fedora's own FFmpeg package, the
# one with the reduced encoder set. It does not `Provide: ffmpeg`, and the
# `ffmpeg` of RPM Fusion carries `libx264`, so installing that one instead would
# make this run say nothing about the encoder question.
#
# `NOT_CRAN` is left unset on purpose. That is the reading CRAN itself makes:
# every `skip_if_no_*()` helper skips, and so do the three argument sweeps. The
# tests that still run are the pure-R ones, which is why CRAN reached the
# remembered-location failures at 0.2.1.
#
# The four lines printed before the check say what the machine is, so a green
# check is read against a machine whose conditions are known rather than
# assumed.

name: Fedora (CRAN model)

on:
  workflow_dispatch:
  pull_request:

jobs:
  fedora-check:
    runs-on: ubuntu-latest
    container: fedora:42
    name: fedora:42, R release, ffmpeg-free

    steps:
      - name: Install R, FFmpeg and the check toolchain
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            R-core R-core-devel R-devel \
            ffmpeg-free mediainfo \
            pandoc texlive-collection-latexrecommended \
            git tar gzip qpdf which
          R --version
          echo "::group::what this machine is"
          cat /etc/fedora-release
          rpm -q which || echo "which: not installed"
          rpm -q ffmpeg-free
          echo "::endgroup::"

      - uses: actions/checkout@v4

      - name: Gate 1 — this build must not have libx264
        run: |
          ffmpeg -hide_banner -encoders > /tmp/encoders.txt
          if grep -q 'libx264' /tmp/encoders.txt; then
            echo "FAIL: this build HAS libx264, so the run would say nothing about the defect."
            echo "Fedora's ffmpeg-free is the package to install; RPM Fusion's ffmpeg carries it."
            exit 1
          fi
          echo "libx264 absent: the encoder condition is reproduced."

      - name: Gate 2 — record what Sys.which() answers for a path
        run: |
          mkdir -p /tmp/whichprobe
          printf '#!/bin/sh\n' > /tmp/whichprobe/stub
          chmod 0755 /tmp/whichprobe/stub
          cat /etc/fedora-release
          rpm -q which || echo "which: not installed"
          Rscript -e 'p <- unname(Sys.which("/tmp/whichprobe/stub"))' \
                  -e 'b <- unname(Sys.which("ffmpeg"))' \
                  -e 'cat("path:[", p, "] bare:[", b, "] NOT_CRAN:[", Sys.getenv("NOT_CRAN"), "]\n", sep = "")' \
                  -e 'if (!nzchar(p) && nzchar(b)) cat("the lookup condition IS reproduced here\n")' \
                  -e 'if (nzchar(p)) cat("the lookup condition is NOT reproduced here: that half rests on the stipulated mock in test-location-portability.R\n")'
          # Not a gate: this one records which of the two CRAN failures the run
          # reproduces the conditions for. Gate 1 is the one that can make the
          # run vacuous, so gate 1 is the one that exits non-zero.

      - name: Install the package dependencies
        run: |
          # Every Imports and every Suggests, with their closure: `--as-cran`
          # ERRORs on a missing Suggests, and `furrr`, `future` and `roxygen2`
          # are three this list used to omit. `R-fs` comes from dnf above
          # because `fs` does not compile on Fedora.
          Rscript -e 'install.packages(c("archive","cli","digest","dplyr","glue","purrr","rappdirs","rlang","tibble","withr","furrr","future","knitr","rmarkdown","roxygen2","spelling","testthat"), repos = "https://cloud.r-project.org", dependencies = TRUE)'

      - name: Build and check
        run: |
          R CMD build .
          # The status is NOT discarded: a check that dies before it writes a
          # `Status:` line must fail this step rather than reach the gate below
          # with no line for it to find.
          R CMD check --as-cran --no-manual tidymedia_*.tar.gz
          echo "=== Status ==="
          tail -3 tidymedia.Rcheck/00check.log

      - name: The check must report no errors, and no encoder or location warning
        run: |
          log=tidymedia.Rcheck/00check.log
          echo "::group::check log"
          cat "$log"
          echo "::endgroup::"
          # A missing `Status:` line is a failure, not a pass: the check must
          # have got far enough to write one.
          if ! grep -qE '^Status:' "$log"; then
            echo "FAIL: the check wrote no Status: line, so it never finished"
            exit 1
          fi
          if grep -qE '^Status:.*ERROR' "$log"; then
            echo "FAIL: the check reported an ERROR"
            exit 1
          fi
          # Scoped to the WARNING and NOTE blocks, which is what the criterion
          # asks about: from each `* checking … WARNING|NOTE` line to the next
          # `* checking` line. A whole-log grep would match an encoder name in
          # an ordinary line, and a `png` or `srt` in a filename is not a
          # warning about an encoder.
          awk '/^\* checking .*(WARNING|NOTE)/ { p = 1; print; next }
               /^\* checking/ { p = 0 }
               p { print }' "$log" > /tmp/warnings.txt
          # Every encoder this build actually has, plus libx264 and the four
          # remembered-location classes. The encoder names come from the build's
          # own listing rather than from a list written here, so the pattern
          # cannot go stale as the build changes.
          names=$(awk '$1 ~ /^[VAS.][F.][S.][X.][B.][D.]$/ && $2 ~ /^[A-Za-z0-9_.-]+$/ { print $2 }' \
                    /tmp/encoders.txt | sort -u | tr '\n' '|')
          pattern="libx264|tidymedia_location_gone|tidymedia_location_not_executable|tidymedia_location_unreadable|tidymedia_no_remembered_location|R_user_dir|${names%|}"
          if grep -nwE "$pattern" /tmp/warnings.txt; then
            echo "FAIL: a warning or note names an encoder or a remembered location"
            exit 1
          fi
          echo "OK: no error, and nothing named an encoder or a remembered location"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fedora-check-logs
          path: |
            tidymedia.Rcheck/00check.log
            tidymedia.Rcheck/00install.out
            tidymedia.Rcheck/tests/
