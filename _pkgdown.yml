url: https://jmgirard.github.io/tidymedia/

template:
  bootstrap: 5

reference:
- title: "Package"
  desc: >
    What tidymedia is for, and how its three kinds of function fit together.
  contents:
  - tidymedia-package
- title: "Concepts"
  desc: >
    Background on arguments that many functions share.
  contents:
  - audio_stream
- title: "Time limits"
  desc: >
    Set a time limit on one call, or on the rest of a function. A program that
    hangs then stops that call, not the R session.
  contents:
  - with_timeout
  - local_timeout
- title: "Direct commands"
  desc: >
    Pass your own arguments to FFmpeg, FFprobe or MediaInfo. Use these for
    anything that tidymedia does not cover.
  contents:
  - ffmpeg
  - ffprobe
  - mediainfo
- title: "Pipeline functions"
  desc: >
    Build an FFmpeg command one step at a time, then compile it or run it.
  contents:
  - ffm_files
  - ffm_trim
  - ffm_seek
  - ffm_drop
  - ffm_crop
  - ffm_scale
  - ffm_fps
  - ffm_codec
  - ffm_map
  - ffm_copy
  - ffm_pixel_format
  - ffm_hstack
  - ffm_vstack
  - ffm_overlay
  - ffm_concat
  - ffm_drawbox
  - ffm_loudnorm
  - ffm_output_options
  - ffm_compile
  - ffm_run
  - ffm_batch
  - ffm_jobs
  - print.tidymedia_ffm
- title: "Task functions"
  desc: >
    Do a common job in one call. Each one is built from the pipeline functions.
  contents:
  - extract_frame
  - extract_frame_batch
  - sample_frames
  - sample_frames_batch
  - extract_audio
  - extract_audio_batch
  - separate_audio_video
  - separate_audio_video_batch
  - convert_audio
  - convert_audio_batch
  - normalize_audio
  - normalize_audio_batch
  - crop_video
  - crop_video_batch
  - anonymize_video
  - anonymize_video_batch
  - strip_metadata
  - strip_metadata_batch
  - format_for_web
  - format_for_web_batch
  - standardize_video
  - standardize_video_batch
  - segment_video
  - segment_video_batch
  - concatenate_videos
  - concatenate_videos_batch
  - compare_videos
  - compare_videos_batch
  - picture_in_picture
  - picture_in_picture_batch
- title: "Checking outputs and recording runs"
  desc: >
    Check that an output has the properties you asked for, and record how the
    files in a batch were made.
  contents:
  - verify_media
  - ffm_manifest
- title: "Media metadata"
  desc: >
    Read container and stream metadata into tibbles.
  contents:
  - probe_all
  - probe_container
  - mediainfo_parameter
  - mediainfo_query
  - mediainfo_template
  - get_duration
  - get_frame_rate
  - get_width
  - get_height
  - get_sample_rate
- title: "FFmpeg capabilities"
  desc: >
    List the codecs and encoders in your FFmpeg build, including hardware
    encoders.
  contents:
  - ffmpeg_codecs
  - ffmpeg_encoders
  - hardware_encoder
  - refresh_ffmpeg_capabilities
- title: "Program management"
  desc: >
    Find, set and install the FFmpeg and MediaInfo programs.
  contents:
  - program_status
  - find_ffmpeg
  - set_program
  - unset_program
  - install_on_win

articles:
- title: Articles
  navbar: ~
  contents:
  - workflow
  - batch
  - metadata
  - verification
